name: Build installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.0)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}" } else { "${{ github.event.inputs.version }}" }
          $v = $v -replace '^[vV]', ''
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: SHA-256
        id: hash
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $h = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($exe.Name)" | Set-Content "dist/$($exe.Name).sha256" -Encoding ascii -NoNewline
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "$($exe.Name)  SHA-256: $h"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TzarFix-Setup-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Attach to release and add SHA-256 to the notes
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          EXE: ${{ steps.hash.outputs.name }}
          SHA: ${{ steps.hash.outputs.sha256 }}
        run: |
          gh release upload $env:TAG "dist/$env:EXE" "dist/$env:EXE.sha256" --clobber
          $body = gh release view $env:TAG --json body -q .body
          if ($body -notmatch [regex]::Escape($env:SHA)) {
            $line = '**SHA-256** `' + $env:EXE + '`: `' + $env:SHA + '`'
            $note = "$body`n`n---`n$line`n`n_Built by GitHub Actions (run $env:GITHUB_RUN_ID) from commit $env:GITHUB_SHA._"
            $tmp = New-TemporaryFile
            Set-Content $tmp $note -Encoding utf8
            gh release edit $env:TAG --notes-file $tmp
          }
